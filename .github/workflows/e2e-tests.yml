
name: E2E Tests

on:
  push:
    branches:
      - feature/laboratorio-testing-opcional
  pull_request:
    branches:
      - feature/laboratorio-testing-obligatorio

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npx vite --host 127.0.0.1 --port 5173 --strictPort
          wait-on: 'http://127.0.0.1:5173'
          command: npm run test:e2e
