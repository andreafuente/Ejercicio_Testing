
name: Unit Tests

on:
  push:
    branches:
      - feature/laboratorio-testing-opcional
  pull_request:
    branches:
      - feature/laboratorio-testing-obligatorio

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test -- --run
            